<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snimci lokacije</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui}
#map{position:fixed;inset:0}#map gmp-map-3d{width:100%;height:100%;display:block}
#ui{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;transition:opacity .3s}
#ui button{font:600 17px system-ui;padding:12px 18px;border-radius:24px;border:0;background:#e8b86a;color:#111}
#msg{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;font:14px system-ui;text-shadow:0 1px 3px #000;z-index:5;transition:opacity .3s}</style></head><body>
<div id="map"></div><div id="msg">Klikni 1, sačekaj da se izoštri (dugmići nestaju), pa snimak ekrana.</div>
<div id="ui"><button data-k="0">1</button><button data-k="1">2</button><button data-k="2">3</button></div>
<script>
(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key:"AIzaSyA7obGqf-l7HMHyqDRBrFQKEs_s5TliWYs",v:"beta",language:"sr-Latn",region:"RS"});
</script>
<script>
const KEY='AIzaSyA7obGqf-l7HMHyqDRBrFQKEs_s5TliWYs';const SITE={lat:44.851946,lng:20.394923};
const rad=d=>d*Math.PI/180;
(async()=>{const {Map3DElement}=await google.maps.importLibrary('maps3d');
 const mPerLat=111320,mPerLng=111320*Math.cos(rad(SITE.lat));let face=215;
 try{const r=await fetch('https://roads.googleapis.com/v1/nearestRoads?points='+SITE.lat+','+SITE.lng+'&key='+KEY).then(r=>r.json());const p=(r.snappedPoints||[])[0];
   if(p){const y=(p.location.longitude-SITE.lng)*mPerLng,x=(p.location.latitude-SITE.lat)*mPerLat;if(Math.hypot(x,y)>2)face=(Math.atan2(y,x)*180/Math.PI+360)%360}}catch(e){}
 let GZ=90;try{const {ElevationService}=await google.maps.importLibrary('elevation');const e=await new ElevationService().getElevationForLocations({locations:[SITE]});if(e.results[0])GZ=e.results[0].elevation}catch(e){}
 const h=(face+180)%360;
 const V=[{range:5200,tilt:38},{range:1300,tilt:50},{range:320,tilt:58}];
 const map=new Map3DElement({center:{...SITE,altitude:GZ},range:V[0].range,tilt:V[0].tilt,heading:h,mode:'SATELLITE'});
 try{map.defaultUIHidden=true}catch(_){}
 document.getElementById('map').append(map);
 const ui=document.getElementById('ui'),msg=document.getElementById('msg');
 ui.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=V[+b.dataset.k];map.center={...SITE,altitude:GZ};map.range=v.range;map.tilt=v.tilt;map.heading=h;
   ui.style.opacity=0;msg.style.opacity=0;setTimeout(()=>{ui.style.opacity=1;msg.style.opacity=1;msg.textContent='Sledeći broj, ili tapni ekran da sakriješ dugmiće.'},12000)});
 document.getElementById('map').addEventListener('click',()=>{ui.style.opacity=0;msg.style.opacity=0;setTimeout(()=>{ui.style.opacity=1;msg.style.opacity=1},12000)});
})();
</script></body></html>
